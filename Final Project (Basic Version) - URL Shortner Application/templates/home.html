<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">URL Shortener</h2>

    <form method="POST" class="mt-4">
        <input type="text" name="url" class="form-control" placeholder="Enter URL here" required>
        <button class="btn btn-primary mt-3 w-100">Shorten URL</button>
    </form>

    {% if error %}
        <div class="alert alert-danger mt-3">{{ error }}</div>
    {% endif %}

    {% if short_url %}
        <div class="mt-4">
            <input type="text" id="shortUrl" class="form-control" value="{{ short_url }}" readonly>
            <button class="btn btn-success mt-2 w-100" onclick="copyURL()">Copy</button>
        </div>
    {% endif %}

    <a href="/history" class="btn btn-link mt-3">View History</a>
</div>

<script>
function copyURL() {
    const copyText = document.getElementById("shortUrl");
    copyText.select();
    document.execCommand("copy");
    alert("Copied to clipboard!");
}
</script>

</body>
</html>
